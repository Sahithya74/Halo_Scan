plugins {
    id "com.android.application"
}

android {
    namespace = "com.haloscan.app"
    compileSdk = 36
    buildToolsVersion = "37.0.0"

    defaultConfig {
        applicationId = "com.haloscan.app"
        minSdk = 26
        targetSdk = 36
        versionCode = 2
        versionName = "1.1"
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // FileProvider: hands camera captures to the web page from the app's private cache,
    // so sample photos never land in the phone's public gallery.
    implementation "androidx.core:core:1.17.0"
}
