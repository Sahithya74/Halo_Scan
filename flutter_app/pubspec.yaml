name: halo_scan
description: >
  Halo Scan — research/decision-support prototype for halo/double-ring fluid-pattern
  image analysis. NOT a diagnostic app. See backend/docs for the medical-safety framing
  this UI must preserve.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

# UNVERIFIED: Flutter/Dart SDK is not installed on the machine this was written on.
# Run `flutter pub get` then `flutter analyze` before trusting this file — see
# flutter_app/README.md.

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  http: ^1.2.2
  provider: ^6.1.2
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
